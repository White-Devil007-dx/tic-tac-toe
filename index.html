<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe</title>
  <style>
    body { font: 18px system-ui, sans-serif; text-align: center; margin: 40px auto; padding: 0 16px; }
    .board { display: grid; grid-template-columns: repeat(3, 90px); gap: 8px; justify-content: center; margin: 24px; }
    button { font: inherit; cursor: pointer; }
    .cell { width: 90px; height: 90px; font-size: 38px; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <p id="status">X's turn</p>
  <div class="board" id="board" aria-label="Tic Tac Toe board"></div>
  <button id="reset">New game</button>

  <script>
    const board = document.querySelector("#board");
    const status = document.querySelector("#status");
    const winningLines = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];
    let cells = Array(9).fill("");
    let turn = "X";
    let finished = false;

    function render() {
      board.innerHTML = "";
      cells.forEach((value, i) => {
        const button = document.createElement("button");
        button.className = "cell";
        button.textContent = value;
        button.setAttribute("aria-label", `Cell ${i + 1}${value ? `, ${value}` : ", empty"}`);
        button.disabled = Boolean(value) || finished;
        button.addEventListener("click", () => play(i));
        board.appendChild(button);
      });
    }

    function play(i) {
      if (cells[i] || finished) return;
      cells[i] = turn;
      const winner = winningLines.find(line => line.every(index => cells[index] === turn));
      if (winner) {
        status.textContent = `${turn} wins!`;
        finished = true;
      } else if (cells.every(Boolean)) {
        status.textContent = "It's a draw!";
        finished = true;
      } else {
        turn = turn === "X" ? "O" : "X";
        status.textContent = `${turn}'s turn`;
      }
      render();
    }

    document.querySelector("#reset").addEventListener("click", () => {
      cells = Array(9).fill("");
      turn = "X";
      finished = false;
      status.textContent = "X's turn";
      render();
    });

    render();
  </script>
</body>
</html>
